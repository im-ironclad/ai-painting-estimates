name: paint-estimator

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paint_estimator
      POSTGRES_PASSWORD: paint_estimator
      POSTGRES_DB: paint_estimator
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paint_estimator"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
